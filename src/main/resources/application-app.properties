# ===== Настройки готового приложения (профиль «app») =====
# Включается при запуске ZettaBilling.exe / zetta-billing.jar с параметром --spring.profiles.active=app

# База хранится в папке пользователя: C:\Users\<имя>\ZettaBilling\data
# (в папку программы писать нельзя, а так данные сохраняются и после обновления приложения)
spring.datasource.url=jdbc:h2:file:~/ZettaBilling/data/zetta-billing

# После запуска сразу открыть сайт в браузере
zetta.open-browser=true

# Меньше технических сообщений в окне программы
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.example.demo=INFO

# ===== Настройки сервера в интернете (профиль «prod») =====
# Включается переменной окружения SPRING_PROFILES_ACTIVE=prod (уже задано в Dockerfile).
# Все значения берутся из переменных окружения, которые задаются на сайте хостинга.

# Порт выдаёт хостинг (переменная PORT), по умолчанию 8080
server.port=${PORT:8080}

# База PostgreSQL. DATABASE_URL — либо jdbc:postgresql://хост:5432/база,
# либо postgresql://логин:пароль@хост/база (такой адрес переводится сам, см. DatabaseUrl.java)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Веб-консоль H2 на сервере не нужна
spring.h2.console.enabled=false

# Пароль директора ОБЯЗАТЕЛЕН: без переменной ZETTA_DIRECTOR_PASSWORD сервер не запустится.
# (Чтобы в интернете не оказался директор с паролем director123.)
zetta.director.login=${ZETTA_DIRECTOR_LOGIN:director}
zetta.director.password=${ZETTA_DIRECTOR_PASSWORD}

# Тестовые абоненты, тарифы и инспектор inspector/inspector123 — только если ZETTA_DEMO_DATA=true
zetta.demo-data=${ZETTA_DEMO_DATA:false}

# Меньше технических сообщений в журнале
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.com.example.demo=INFO

spring.application.name=demo

# ===== База данных (SQL) =====
# H2 хранит базу в файле ./data/zetta-billing.mv.db (устанавливать ничего не нужно)
spring.datasource.url=jdbc:h2:file:./data/zetta-billing
spring.datasource.username=sa
spring.datasource.password=

# Таблицы создаются/обновляются автоматически по классам @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Веб-консоль для просмотра таблиц: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/zetta-billing, User: sa, пароль пустой)
spring.h2.console.enabled=true

# ===== Чтобы перейти на PostgreSQL, замените блок выше на: =====
# spring.datasource.url=jdbc:postgresql://localhost:5432/zetta_billing
# spring.datasource.username=postgres
# spring.datasource.password=ваш_пароль
# и в pom.xml замените зависимость h2 на org.postgresql:postgresql

# Отдавать текст ошибки (например «Лицевой счёт уже занят») фронтенду
spring.web.error.include-message=always

# ===== Первые сотрудники =====
# Директор создаётся, если в базе нет ни одного директора.
# Тестовый инспектор создаётся, только если таблица сотрудников совсем пустая.
# Поменяйте пароли до того, как выкладывать сайт в интернет!
zetta.director.login=director
zetta.director.password=director123
zetta.inspector.login=inspector
zetta.inspector.password=inspector123

# Тестовые данные (абоненты, история, тарифы, инспектор inspector/inspector123).
# На сервере в интернете по умолчанию выключены (см. application-prod.properties).
zetta.demo-data=true

spring.application.name=demo

# ===== База данных (SQL) =====
# H2 хранит базу в файле ./data/zetta-billing.mv.db (устанавливать ничего не нужно)
spring.datasource.url=jdbc:h2:file:./data/zetta-billing
spring.datasource.username=sa
spring.datasource.password=

# Таблицы создаются/обновляются автоматически по классам @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Веб-консоль для просмотра таблиц: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/zetta-billing, User: sa, пароль пустой)
spring.h2.console.enabled=true

# ===== Чтобы перейти на PostgreSQL, замените блок выше на: =====
# spring.datasource.url=jdbc:postgresql://localhost:5432/zetta_billing
# spring.datasource.username=postgres
# spring.datasource.password=ваш_пароль
# и в pom.xml замените зависимость h2 на org.postgresql:postgresql

# Отдавать текст ошибки (например «Лицевой счёт уже занят») фронтенду
server.error.include-message=always

# ===== Первый сотрудник (создаётся, если таблица EMPLOYEES пустая) =====
# Поменяйте пароль до того, как выкладывать сайт в интернет!
zetta.admin.login=inspector
zetta.admin.password=inspector123
